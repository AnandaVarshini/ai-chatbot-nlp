<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AI Study Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 30px;
        }
        .nav-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: white;
            text-decoration: none;
        }
        .nav-brand i { color: #667eea; margin-right: 10px; }
        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: white;
            background: rgba(102,126,234,0.15);
        }
        .user-badge {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            padding: 6px 14px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logout-link {
            color: #ff4757 !important;
            cursor: pointer;
        }
        .logout-link:hover { background: rgba(255,71,87,0.15) !important; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(102,126,234,0.3);
        }
        .stat-card .stat-icon { font-size: 32px; margin-bottom: 10px; }
        .stat-card .stat-number { font-size: 36px; font-weight: 700; color: white; }
        .stat-card .stat-label { color: rgba(255,255,255,0.5); font-size: 14px; }
        .stat-card.purple .stat-icon { color: #667eea; }
        .stat-card.green .stat-icon { color: #00ff88; }
        .stat-card.orange .stat-icon { color: #ffa502; }
        .stat-card.pink .stat-icon { color: #ff6b81; }
        .top-intents {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .top-intents h3 {
            color: rgba(255,255,255,0.7);
            margin-bottom: 15px;
            font-weight: 600;
        }
        .intent-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }
        .intent-bar .intent-name {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            min-width: 120px;
        }
        .intent-bar .bar-track {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            overflow: hidden;
        }
        .intent-bar .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 1s ease;
        }
        .intent-bar .intent-count {
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            min-width: 40px;
            text-align: right;
        }
        .no-data {
            color: rgba(255,255,255,0.3);
            text-align: center;
            padding: 20px;
        }
        h1 { color: white; font-family: 'Orbitron', sans-serif; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: rgba(255,255,255,0.4); margin-bottom: 25px; }
        @media (max-width: 768px) {
            .nav-bar { flex-wrap: wrap; gap: 10px; padding: 12px 15px; }
            .nav-links { gap: 8px; }
            .nav-links a { font-size: 12px; padding: 5px 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="index.html" class="nav-brand"><i class="fas fa-robot"></i> AI Assistant</a>
            <div class="nav-links">
                <a href="index.html"><i class="fas fa-comment"></i> Chat</a>
                <a href="dashboard.html" class="active"><i class="fas fa-chart-pie"></i> Dashboard</a>
                <a href="history.html"><i class="fas fa-history"></i> History</a>
                <span class="user-badge"><i class="fas fa-user-circle"></i> <span id="navUsername">User</span></span>
                <a class="logout-link" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>

        <h1><i class="fas fa-chart-pie" style="color:#667eea;"></i> Dashboard</h1>
        <p class="subtitle">Your AI learning statistics at a glance</p>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card purple">
                <div class="stat-icon"><i class="fas fa-comments"></i></div>
                <div class="stat-number" id="totalQueries">0</div>
                <div class="stat-label">Total Queries</div>
            </div>
            <div class="stat-card green">
                <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                <div class="stat-number" id="answeredQueries">0</div>
                <div class="stat-label">Answered</div>
            </div>
            <div class="stat-card orange">
                <div class="stat-icon"><i class="fas fa-question-circle"></i></div>
                <div class="stat-number" id="unansweredQueries">0</div>
                <div class="stat-label">Unanswered</div>
            </div>
            <div class="stat-card pink">
                <div class="stat-icon"><i class="fas fa-percent"></i></div>
                <div class="stat-number" id="answerRate">0%</div>
                <div class="stat-label">Answer Rate</div>
            </div>
        </div>

        <div class="top-intents">
            <h3><i class="fas fa-tag" style="color:#667eea;"></i> Top Intent Categories</h3>
            <div id="intentList"><div class="no-data">No data yet. Start chatting to see insights!</div></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8080';

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        function checkAuth() {
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');
            if (!token) {
                window.location.href = 'login.html';
                return false;
            }
            document.getElementById('navUsername').textContent = username || 'User';
            return true;
        }

        async function loadDashboard() {
            const userId = localStorage.getItem('userId');
            const token = localStorage.getItem('token');
            try {
                let response = await fetch(`${API_URL}/api/analytics/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) {
                    response = await fetch(`${API_URL}/api/analytics`);
                }
                const data = await response.json();
                updateDashboard(data);
            } catch (error) {
                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card" style="grid-column:1/-1;text-align:center;padding:40px;">
                        <p style="color:rgba(255,255,255,0.3);">Could not load analytics. Start chatting to see data!</p>
                    </div>
                `;
            }
        }

        function updateDashboard(data) {
            const total = data.total_queries || 0;
            const answered = data.answered_queries || 0;
            const unanswered = data.unanswered_queries || 0;
            const rate = total > 0 ? Math.round((answered / total) * 100) : 0;

            document.getElementById('totalQueries').textContent = total;
            document.getElementById('answeredQueries').textContent = answered;
            document.getElementById('unansweredQueries').textContent = unanswered;
            document.getElementById('answerRate').textContent = rate + '%';

            const intents = data.top_intents || {};
            const intentList = document.getElementById('intentList');
            if (Object.keys(intents).length === 0) {
                intentList.innerHTML = '<div class="no-data">No data yet. Start chatting to see insights!</div>';
                return;
            }
            const maxCount = Math.max(...Object.values(intents));
            let html = '';
            for (const [intent, count] of Object.entries(intents)) {
                const percentage = maxCount > 0 ? (count / maxCount) * 100 : 0;
                html += `
                    <div class="intent-bar">
                        <span class="intent-name">${intent}</span>
                        <div class="bar-track"><div class="bar-fill" style="width: ${percentage}%;"></div></div>
                        <span class="intent-count">${count}</span>
                    </div>
                `;
            }
            intentList.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAuth()) return;
            loadDashboard();
        });
    </script>
</body>
</html>
